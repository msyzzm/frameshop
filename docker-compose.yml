services:
  frameshop:
    build: .
    # Published on every interface. FRAMESHOP_TOKEN is still required - the
    # server refuses to bind non-loopback without it - but Basic auth over
    # plain HTTP is a lock, not a tunnel: the password crosses the wire in the
    # clear. Terminate TLS in front of this, or keep it on a private network.
    #
    # On Linux, publishing a port writes iptables rules that bypass ufw, so a
    # "deny incoming" policy will not cover this.
    ports:
      - "8765:8765"
    environment:
      # No default. Compose fails loudly rather than starting it unprotected.
      FRAMESHOP_TOKEN: ${FRAMESHOP_TOKEN:?set FRAMESHOP_TOKEN before starting}
    volumes:
      # A named volume, because a bind mount brings the host directory's own
      # ownership with it and overrides the image's chown - the container runs
      # as uid 10001 and gets EACCES on /data. Docker seeds a named volume from
      # the image, ownership included, so this works with no setup.
      #
      # For a host directory instead, swap in the bind mount below and hand it
      # to that uid first:
      #     sudo chown -R 10001:10001 ./data
      # or run the container as yourself:
      #     user: "${UID:-1000}:${GID:-1000}"
      #
      # - ./data:/data
      - frameshop-data:/data
    restart: unless-stopped

volumes:
  frameshop-data:
