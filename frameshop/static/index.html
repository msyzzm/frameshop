<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>frameshop</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body data-token="__TOKEN__">

<header>
  <strong>frameshop</strong>
  <button id="tab1" class="step">1 · key video</button>
  <button id="tab2" class="step">2 · pick frames</button>
  <span id="dir" class="muted mono"></span>
  <span class="spacer"></span>
  <span id="count" class="pill"></span>
</header>

<section id="step1">
  <div class="card">
    <h2>Key a green screen out of a video</h2>
    <p class="muted small">
      Drop a clip below. Every frame is keyed to RGBA and written as a PNG
      sequence, which step 2 then opens automatically.
    </p>

    <div id="drop">
      <strong>Drop a video here</strong>
      <span class="muted small">or click to choose &middot; mp4, mov, webm, mkv</span>
      <input id="file" type="file" accept="video/*" hidden>
    </div>

    <div class="bar wrap">
      <label>trim <input id="trim" type="number" class="num" value="0" min="0"
                         title="drop this many frames off the front"></label>
      <label>lo <input id="lo" type="number" class="num" value="8" step="1"
                       title="G-max(R,B) at/below which a pixel is fully opaque"></label>
      <label>hi <input id="hi" type="number" class="num" value="45" step="1"
                       title="G-max(R,B) at/above which a pixel is fully transparent"></label>
      <span class="spacer"></span>
      <label>out <input id="workroot" type="text" class="wide"></label>
    </div>

    <div class="bar wrap">
      <button id="keyGo" class="primary">Key it</button>
      <progress id="keyProgress" value="0" max="1" hidden></progress>
      <span id="keyStatus" class="muted small"></span>
    </div>

    <hr>

    <div class="bar wrap">
      <label>or open a folder of frames
        <input id="openDir" type="text" class="wide" placeholder="D:\frames_keyed_png"></label>
      <button id="openGo">Open</button>
    </div>
  </div>
</section>

<main>
  <section id="stage">
    <div class="bar">
      <button id="play">Play</button>
      <label>fps <input id="fps" type="number" min="1" max="60" step="1" value="24" class="num"></label>
      <label><input id="onlyPicked" type="checkbox" checked> picked only</label>
      <span class="spacer"></span>
      <label>bg
        <select id="bg">
          <option value="checker">checker</option>
          <option value="#000000">black</option>
          <option value="#ffffff">white</option>
          <option value="#ff00ff">magenta</option>
        </select>
      </label>
      <label><input id="cropOn" type="checkbox"> crop</label>
      <button id="cropAuto" title="fit a box around the subject across every picked frame">auto</button>
      <button id="cropReset" class="ghost">reset</button>
    </div>

    <div id="canvasWrap">
      <canvas id="view"></canvas>
    </div>

    <div class="bar">
      <button id="zoomOut" class="ghost" title="zoom out">&minus;</button>
      <span id="zoomLabel" class="muted mono small">fit</span>
      <button id="zoomIn" class="ghost" title="zoom in">+</button>
      <button id="zoomFit" class="ghost">fit</button>
      <button id="zoom1" class="ghost">1:1</button>
      <input id="scrub" type="range" min="0" max="0" value="0">
      <span id="frameLabel" class="muted mono"></span>
    </div>
  </section>

  <section id="side">
    <div class="bar wrap">
      <button data-pick="all">All</button>
      <button data-pick="none">None</button>
      <button data-pick="invert">Invert</button>
      <button data-thin="2" title="keep every 2nd picked frame">1/2</button>
      <button data-thin="3" title="keep every 3rd picked frame">1/3</button>
      <span class="spacer"></span>
      <span class="muted small">click = solo &middot; ctrl = toggle &middot; shift = range</span>
    </div>
    <div id="grid"></div>
  </section>
</main>

<footer>
  <div class="bar wrap">
    <label>crop
      <input id="cx" type="number" class="num" placeholder="x" title="left edge, source px">
      <input id="cy" type="number" class="num" placeholder="y" title="top edge, source px">
      <input id="cw" type="number" class="num" placeholder="w" title="width, source px">
      <input id="ch" type="number" class="num" placeholder="h" title="height, source px">
    </label>
    <label>size
      <input id="rw" type="number" class="num"> &times; <input id="rh" type="number" class="num">
    </label>
    <label><input id="linkAspect" type="checkbox" checked> lock ratio</label>
    <button id="sizeReset" class="ghost">reset</button>
  </div>

  <div class="bar wrap">
    <label><input type="checkbox" class="fmt" value="sheet" checked> sheet</label>
    <label>cols <input id="cols" type="number" min="0" class="num" value="0" title="0 = auto"></label>
    <label><input type="checkbox" class="fmt" value="gif"> gif</label>
    <label><input type="checkbox" class="fmt" value="apng"> apng</label>
    <span class="spacer"></span>
    <label>name <input id="stem" type="text"></label>
    <label>out <input id="outdir" type="text" class="wide" placeholder="D:\output"></label>
    <button id="export" class="primary">Export</button>
  </div>

  <pre id="log"></pre>
</footer>

<script src="/static/app.js"></script>
</body>
</html>
